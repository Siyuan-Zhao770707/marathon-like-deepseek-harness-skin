name: Publish v2.4.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v2.4.3.yml'
      - 'tests/lifecycle.test.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish v2.4.3]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source version
        run: node -e "if (require('./package.json').version !== '2.4.3') process.exit(1)"
      - name: Rebuild and verify checked-in client
        run: |
          npm run build
          git diff --exit-code -- lib/client.js
      - name: Verify plugin
        run: |
          npm run check
          npm test
      - name: Package plugin and checksums
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          cd dist
          sha256sum dsh-industrial-acid-skin-2.4.3.tgz > SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.4.3 dist/dsh-industrial-acid-skin-2.4.3.tgz dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "v2.4.3 · User message readability fix" \
            --notes-file docs/RELEASE-v2.4.3.md \
            --latest
