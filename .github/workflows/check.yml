name: Check skin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify reproducible client
        run: |
          npm run build
          git diff --exit-code -- lib/client.js
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Inspect runtime package
        run: npm pack --dry-run
