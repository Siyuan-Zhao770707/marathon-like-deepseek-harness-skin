name: Publish v2.4.10 stable

# The only publication trigger is the addition of these approved release notes to main.
on:
  push:
    branches: [main]
    paths:
      - docs/RELEASE-v2.4.10.md

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck code and version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          if ($pkg.version -ne '2.4.10') { throw "Unexpected package version" }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Build failed" }
          git diff --exit-code -- lib/client.js
          if ($LASTEXITCODE -ne 0) { throw "Build output mismatch" }
          npm run check
          if ($LASTEXITCODE -ne 0) { throw "Check failed" }
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Tests failed" }
      - name: Download exact maintainer-tested Windows archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          gh run download 40899767059 -n dsh-skin-2.4.10-windows-smoke -D dist --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Failed to fetch tested archive" }
          $archive = 'dist/dsh-industrial-acid-skin-2.4.10.tgz'
          if (!(Test-Path $archive)) { throw "Missing tested TGZ" }
          if (!(Test-Path 'dist/SHA256SUMS.txt')) { throw "Missing tested SHA256 list" }
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = 'f171884c1f8c710dfa1d1e62dc3603dd00efeded5d9e9b73b77f43cb24141100'
          if ($hash -ne $expected) { throw "Tested artifact SHA256 mismatch" }
          if (-not ((Get-Content dist/SHA256SUMS.txt -Raw).Contains($expected))) { throw "Checksum manifest mismatch" }
          Write-Output "Approved Windows artifact SHA256: $hash"
      - name: Publish official stable release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release create v2.4.10 dist/dsh-industrial-acid-skin-2.4.10.tgz dist/SHA256SUMS.txt --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "v2.4.10 - CSS compatibility and macOS window controls" --notes-file docs/RELEASE-v2.4.10.md --latest
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          gh release view v2.4.10 --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Published release could not be verified" }
